<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TimeToMeal">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/000000/restaurant-menu.png">
    <meta name="theme-color" content="#e14b18">
    <title>TimeToMeal - Hostel Canteen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            fontSize: {
              'xs': '14px',      // Small labels (14px)
              'sm': '14px',      // Bottom Navigation & standard labels (14px)
              'base': '16px',    // Buttons (16px)
              'lg': '18px',      // Greeting (18px)
              'xl': '20px',      // Food Name (20px)
              '2xl': '24px',     // Price & Mobile Section Heading (24px)
              '3xl': '30px',     // User Name (30px)
              '4xl': '32px',     // Page Heading & Desktop App Title (32px)
            }
          }
        }
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        * {
            font-family: 'Inter', sans-serif !important;
            -webkit-font-smoothing: antialiased !important;
            -moz-osx-font-smoothing: grayscale !important;
            text-rendering: optimizeLegibility !important;
        }
        html {
            scroll-behavior: smooth !important;
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            width: 100%;
            scroll-behavior: smooth;
        }
        #root {
            width: 100%;
            overflow-x: hidden;
        }
        /* Hide scrollbars across all browsers/mobile while preserving smooth scroll */
        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        * {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
        /* Application-wide buttery smooth scrolling for scrollable panels & menus */
        .overflow-y-auto, .overflow-x-auto, 
        [class*="overflow-y-"], [class*="overflow-x-"], 
        [class*="overflow-scroll"] {
            scroll-behavior: smooth !important;
            -webkit-overflow-scrolling: touch !important; /* Enable native elastic momentum scrolling on iOS */
        }
        @media print {
            body * {
                visibility: hidden !important;
            }
            .print-area, .print-area * {
                visibility: visible !important;
            }
            .print-area {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 12px !important;
                box-shadow: none !important;
                border: none !important;
                background: white !important;
                color: black !important;
            }
            .print-hidden {
                display: none !important;
            }
        }
        /* Mobile specific adjustments */
        @media (max-width: 640px) {
            html {
                font-size: 14px;
            }
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.1",
    "@lottiefiles/dotlottie-react": "https://esm.sh/@lottiefiles/dotlottie-react@0.13.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-slate-950 dark:text-slate-100 transition-colors">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
